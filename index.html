<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Firma — Sipnology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Montserrat', system-ui, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  align-items: stretch;
}

.app {
  display: flex;
  width: 100%;
  min-height: 100vh;
  gap: 0;
}

/* ── Sidebar ── */
.sidebar {
  width: 320px;
  flex-shrink: 0;
  background: #fff;
  padding: 28px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 0;
  box-shadow: 2px 0 12px rgba(0,0,0,.07);
  overflow-y: auto;
}

.sidebar-title {
  font-size: 16px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-title svg { flex-shrink: 0; }

.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 5px;
}

.field input[type="text"] {
  width: 100%;
  padding: 9px 11px;
  border: 1.5px solid #e3e3e3;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: #222;
  outline: none;
  transition: border-color .15s;
}

.field input[type="text"]:focus { border-color: #E5471C; }

.section-sep {
  font-size: 10px;
  font-weight: 700;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: .7px;
  margin: 8px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #eee;
}

/* Toggle rows */
.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 1.5px solid #e3e3e3;
  border-radius: 10px;
  margin-bottom: 8px;
  transition: border-color .15s, background .15s;
}

.toggle-row.active {
  border-color: #E5471C;
  background: #fff7f5;
}

.toggle-row.disabled {
  opacity: .5;
}

/* iOS-style toggle switch */
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
  flex-shrink: 0;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #ddd;
  border-radius: 20px;
  cursor: pointer;
  transition: background .2s;
}

.slider::before {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

.switch input:checked + .slider { background: #E5471C; }
.switch input:checked + .slider::before { transform: translateX(16px); }

.icon-field {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 1;
  min-width: 0;
}

.icon-field .icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.icon-field input[type="text"] {
  border: none;
  padding: 0;
  background: transparent;
  font-size: 12.5px;
  font-family: inherit;
  color: #333;
  outline: none;
  width: 100%;
  min-width: 0;
}

.icon-field input[type="text"]::placeholder { color: #bbb; }

/* Export button */
.export-btn {
  margin-top: 20px;
  padding: 13px;
  background: linear-gradient(135deg, #E5471C 0%, #8C1000 100%);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.export-btn:hover { opacity: .93; }
.export-btn:active { transform: scale(.98); }

/* ── Preview area ── */
.preview {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 32px;
  gap: 14px;
}

.preview-label {
  font-size: 11px;
  font-weight: 700;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: .7px;
  align-self: flex-start;
}

.canvas-wrap {
  /* Checkerboard to visualise transparency */
  background-image:
    linear-gradient(45deg, #d0d0d0 25%, transparent 25%),
    linear-gradient(-45deg, #d0d0d0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #d0d0d0 75%),
    linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-color: #e8e8e8;
  border-radius: 14px;
  box-shadow: 0 6px 28px rgba(0,0,0,.14);
  overflow: hidden;
  max-width: 100%;
}

.canvas-wrap canvas {
  display: block;
  max-width: 100%;
  height: auto;
}

.preview-note {
  font-size: 11px;
  color: #bbb;
  letter-spacing: .3px;
}
</style>
</head>

  <!-- ── Sidebar form ── -->

    <div class="toggle-row active" id="row-email">

      <div class="icon-field">
        <div class="icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#E5471C"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </div>
        <input type="text" id="f-email" value="fernando.fernandez@sipnology.com.mx" placeholder="Correo electrónico">
      </div>
    </div>

    <!-- Web -->
    <div class="toggle-row active" id="row-web">
      <label class="switch">
        <input type="checkbox" id="chk-web" checked>
        <span class="slider"></span>
      </label>
      <div class="icon-field">
        <div class="icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E5471C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <input type="text" id="f-web" value="www.sipnology.com.mx" placeholder="Sitio web">
      </div>
    </div>

    <button class="export-btn" id="btn-export">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar PNG
    </button>

  </aside>

  <!-- ── Preview ── -->
  <main class="preview">
    <div class="preview-label">Vista previa · transparencia real</div>
    <div class="canvas-wrap">
      <canvas id="sig" width="660" height="307"></canvas>
    </div>
    <div class="preview-note">PNG @2× · 1320×614 px · 288 DPI · se inserta automáticamente a 11.64×5.41 cm en Outlook · nítido en Retina</div>
  </main>

</div>

// ─── Canvas & image setup ──────────────────────────────────────────────────────
const canvas = document.getElementById('sig');
const ctx    = canvas.getContext('2d');
const W = 660, H = 307, RADIUS = 17;
const SCALE  = 3;
canvas.width  = W * SCALE;   // 1980px physical buffer
canvas.height = H * SCALE;   // 921px physical buffer
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(SCALE, SCALE);     // all drawing stays in 660×307 logical coords

const logoImg = new Image();
logoImg.src   = 'data:image/png;base64,' + LOGO_B64;
logoImg.onload = draw;

// ─── State ────────────────────────────────────────────────────────────────────
function getState() {
  return {
    name:      document.getElementById('f-name').value,
    title:     document.getElementById('f-title').value,
    phone:     document.getElementById('f-phone').value,
    email:     document.getElementById('f-email').value,
    web:       document.getElementById('f-web').value,
    showPhone: document.getElementById('chk-phone').checked,
    showEmail: document.getElementById('chk-email').checked,
    showWeb:   document.getElementById('chk-web').checked,
  };
}

function visibleContacts(s) {
  const rows = [];
  if (s.showPhone && s.phone.trim()) rows.push({ type: 'phone', value: s.phone.trim() });
  if (s.showEmail && s.email.trim()) rows.push({ type: 'email', value: s.email.trim() });
  if (s.showWeb   && s.web.trim())   rows.push({ type: 'web',   value: s.web.trim()   });
  return rows;
}

// ─── Icon drawers ──────────────────────────────────────────────────────────────
function drawPhone(ctx, cx, cy, r) {
  const sc = (r * 2) / 24, ox = cx - r, oy = cy - r;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(sc, sc);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2 / sc;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke(new Path2D('M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.26h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.86a16 16 0 0 0 6.29 6.29l1.67-1.67a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z'));
  ctx.restore();
}

function drawEmail(ctx, cx, cy, r) {
  const sc = (r * 2) / 24, ox = cx - r, oy = cy - r;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(sc, sc);
  ctx.fillStyle = 'white';
  ctx.fill(new Path2D('M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'));
  ctx.restore();
}

function drawGlobe(ctx, cx, cy, r) {
  const sc = (r * 2) / 24, ox = cx - r, oy = cy - r;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(sc, sc);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2 / sc;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(12, 12, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 12); ctx.lineTo(22, 12); ctx.stroke();
  ctx.stroke(new Path2D('M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'));
  ctx.restore();
}

// ─── Main draw function ────────────────────────────────────────────────────────
function draw() {
  const s = getState();
  ctx.clearRect(0, 0, W, H);

  // Rounded rect clip
  ctx.save();
  const p = new Path2D();
  p.moveTo(RADIUS, 0);
  p.lineTo(W - RADIUS, 0);
  p.quadraticCurveTo(W, 0, W, RADIUS);
  p.lineTo(W, H - RADIUS);
  p.quadraticCurveTo(W, H, W - RADIUS, H);
  p.lineTo(RADIUS, H);
  p.quadraticCurveTo(0, H, 0, H - RADIUS);
  p.lineTo(0, RADIUS);
  p.quadraticCurveTo(0, 0, RADIUS, 0);
  p.closePath();
  ctx.clip(p);

  // Gradient background
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#E5471C');
  g.addColorStop(1, '#8C1000');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // ── Logo ──
  ctx.drawImage(logoImg, 32, 21, 47, 69);

  // ── Sipnology wordmark ──
  ctx.fillStyle = 'white';
  ctx.font = 'bold 16px Montserrat, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('Sipnology', 88, 56);

  // ── Separator ──
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.38)';
  ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(32, 101); ctx.lineTo(628, 101); ctx.stroke();
  ctx.restore();

  // ── Name ──
  ctx.fillStyle = 'white';
  ctx.font = 'bold 26px Montserrat, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s.name || 'Nombre', 32, 138);

  // ── Title ──
  ctx.font = '400 14px Montserrat, sans-serif';
  ctx.fillText(s.title || 'Cargo', 32, 160);

  // ── Contact rows (dynamic, vertically centred in lower zone) ──
  const contacts = visibleContacts(s);
  const CX = 51, CR = 15, ROW_H = 37;
  const startY = 172; // fixed: starts just below "cargo", no empty gap

  contacts.forEach((c, i) => {
    const cy = startY + i * ROW_H + ROW_H / 2;

    // Semi-transparent circle
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.27)';
    ctx.beginPath();
    ctx.arc(CX, cy, CR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Icon inside circle
    const ir = CR * 0.58;
    if (c.type === 'phone') drawPhone(ctx, CX, cy, ir);
    else if (c.type === 'email') drawEmail(ctx, CX, cy, ir);
    else if (c.type === 'web')   drawGlobe(ctx, CX, cy, ir);

    // Text
    ctx.fillStyle = 'white';
    ctx.font = '400 12px Montserrat, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.value, 75, cy);
  });

  ctx.restore(); // end clip
}

// ─── CRC-32 (polinomio 0xEDB88320, estándar PNG) ─────────────────────────────
const _CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function _crc32(buf, s, e) {
  let c = 0xFFFFFFFF;
  for (let i = s; i < e; i++) c = (_CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8)) >>> 0;
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// Inserta chunk pHYs justo después del IHDR. Elimina cualquier pHYs previo.
function injectPHYs(src, ppm) {
  const phys = new Uint8Array(21);          // 4 len + 4 type + 9 data + 4 crc
  const dv   = new DataView(phys.buffer);
  dv.setUint32(0, 9);                       // longitud de datos
  phys[4]=0x70;phys[5]=0x48;phys[6]=0x59;phys[7]=0x73; // 'pHYs'
  dv.setUint32(8, ppm); dv.setUint32(12, ppm); phys[16] = 1; // X,Y px/m, unit=metre
  dv.setUint32(17, _crc32(phys, 4, 17));
  const parts = [src.subarray(0, 8)];
  let pos = 8, done = false;
  while (pos < src.length) {
    const dlen = (src[pos]<<24|src[pos+1]<<16|src[pos+2]<<8|src[pos+3]) >>> 0;
    const type = String.fromCharCode(src[pos+4],src[pos+5],src[pos+6],src[pos+7]);
    const end  = pos + 12 + dlen;
    if (type !== 'pHYs') parts.push(src.subarray(pos, end));
    pos = end;
    if (type === 'IHDR' && !done) { parts.push(phys); done = true; }
  }
  const out = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
  let off = 0; parts.forEach(p => { out.set(p, off); off += p.length; });
  return out;
}

// ─── Export PNG @2× calibrado para Outlook — 100% en el navegador ────────────
// Análisis de la firma actual en Outlook:
//   • Tamaño original: 5.08 × 2.33 cm → al 229% de escala → 11.64 × 5.42 cm
//   • pHYs calibrado para que Outlook muestre a 11.64 × 5.41 cm al 100% (sin escalar)
//   • Resolución: 1320×614 px (2×) → nítido 1:1 en pantallas Retina a ese tamaño
//   • pHYs = 11340 px/m = 113.4 px/cm = 288 DPI → 1320px / 113.4 = 11.64 cm
document.getElementById('btn-export').addEventListener('click', () => {
  // 1. Renderizar a 2× (1320×614) — nítido en pantallas Retina
  canvas.width  = W * 2;    // 1320 px
  canvas.height = H * 2;    // 614 px
  ctx.scale(2, 2);
  draw();

  // 2. Capturar PNG nativo a 1320×614
  const raw = canvas.toDataURL('image/png');

  // 3. Restaurar vista previa 3× instantáneamente
  canvas.width  = W * SCALE;  // 1980
  canvas.height = H * SCALE;  // 921
  ctx.scale(SCALE, SCALE);
  draw();

  // 4. Inyectar pHYs = 11340 px/m (= 288 DPI = 113.4 px/cm)
  //    → Outlook/Word muestran automáticamente a 11.64 × 5.41 cm sin escalar
  //    → Retina: 1320 px en ~11.64 cm = 113.4 px/cm lógicos × 2 físicos = nítido
  const bin = atob(raw.split(',')[1]);
  const src = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) src[i] = bin.charCodeAt(i);
  const out = injectPHYs(src, 11340);   // 11340 px/m = 288 DPI

  // 5. Descargar
  const blob = new Blob([out], { type: 'image/png' });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = 'firma_sipnology.png';
  link.href = url;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
});

// ─── Live updates ─────────────────────────────────────────────────────────────
['f-name','f-title','f-phone','f-email','f-web'].forEach(id => {
  document.getElementById(id).addEventListener('input', draw);
});

// Checkbox toggles
[['chk-phone','row-phone','f-phone'],
 ['chk-email','row-email','f-email'],
 ['chk-web',  'row-web',  'f-web' ]].forEach(([chk, row, inp]) => {
  document.getElementById(chk).addEventListener('change', function() {
    const rowEl = document.getElementById(row);
    const inpEl = document.getElementById(inp);
    if (this.checked) {
      rowEl.classList.add('active');
      rowEl.classList.remove('disabled');
      inpEl.disabled = false;
    } else {
      rowEl.classList.remove('active');
      rowEl.classList.add('disabled');
      inpEl.disabled = true;
    }
    draw();
  });
});

// Initial draw when fonts are ready
document.fonts.ready.then(draw);
